name: OIDC Probe
on: 
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Get OIDC token
        run: |
          echo "=== OIDC TOKEN PROBE ==="
          echo "Request URL: $ACTIONS_ID_TOKEN_REQUEST_URL"
          
          for AUD in "sts.amazonaws.com" "api://AzureADTokenExchange" "sigstore" "https://github.com"; do
            echo ""
            echo "--- Audience: $AUD ---"
            RESP=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"               "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUD}" 2>&1)
            
            echo "$RESP" | python3 -c "
import sys, json, base64
try:
    data = json.loads(sys.stdin.read())
    if 'value' in data:
        parts = data['value'].split('.')
        padding = '=' * (4 - len(parts[1]) % 4)
        claims = json.loads(base64.urlsafe_b64decode(parts[1] + padding))
        for k,v in sorted(claims.items()):
            print(f'  {k}: {v}')
    else:
        print(f'  Error: {data}')
except Exception as e:
    print(f'  Parse error: {e}')
"
          done
          
          echo ""
          echo "=== RUNNER CLOUD METADATA ==="
          curl -sS --connect-timeout 2 -H "Metadata: true" "http://169.254.169.254/metadata/instance?api-version=2021-02-01" 2>&1 | head -5 || echo "Not Azure"
          curl -sS --connect-timeout 2 -H "Metadata-Flavor: Google" "http://metadata.google.internal/computeMetadata/v1/" 2>&1 | head -5 || echo "Not GCP"
          curl -sS --connect-timeout 2 "http://169.254.169.254/latest/meta-data/" 2>&1 | head -5 || echo "Not AWS"
          
          echo ""
          echo "=== NETWORK ==="
          ip addr show 2>/dev/null | grep "inet "
          cat /etc/resolv.conf 2>/dev/null | grep nameserver
          
          echo ""
          echo "=== /proc/self/status ==="
          cat /proc/self/status | head -10
