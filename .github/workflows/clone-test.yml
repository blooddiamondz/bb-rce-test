name: Clone Test
on: workflow_dispatch
jobs:
  clone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: check
        run: |
          echo "=== Structure ==="
          find . -name "*.sh" -o -name "post-*" 2>/dev/null | head -20
          ls -la .git/hooks/ 2>/dev/null
          cat /tmp/rce_proof_hook.txt 2>/dev/null || echo "No hook execution"
          echo "=== Git version ==="
          git --version
          echo "=== Symlinks ==="
          find . -type l 2>/dev/null
